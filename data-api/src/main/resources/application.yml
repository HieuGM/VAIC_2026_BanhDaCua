server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: hanoi-heart-data-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB:hanoi_heart}
    username: ${DB_USER:hanoiheart}
    password: ${DB_PASS:hanoiheart}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: hospital
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    schemas: hospital
    default-schema: hospital
    locations: classpath:db/migration
    baseline-on-migrate: true

spring.config.import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health,info

hanoi-heart:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  chatbot:
    # chatbot-service (FastAPI) base URL — data-api proxies POST /api/v1/chat
    base-url: ${CHATBOT_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${CHATBOT_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${CHATBOT_READ_TIMEOUT_MS:10000}
