# Host nginx site — Hanoi Heart Hospital (Option B: host nginx serves the SPA).
#
# The VPS nginx listens on :80, serves the CRA static build from disk, and proxies
# /data/* to the data-api container (exposed on host 127.0.0.1:8081).
#
# Install (Debian/Ubuntu nginx layout):
#   sudo cp deploy/nginx/heca.tolalinhne.site.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/heca.tolalinhne.site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# If your nginx uses conf.d/ instead of sites-enabled/, copy this file to /etc/nginx/conf.d/.
#
# TLS (after the site is live on :80):
#   sudo certbot --nginx -d heca.tolalinhne.site
# certbot rewrites this block to add listen 443 ssl + cert paths in place.

server {
    listen 80;
    listen [::]:80;
    server_name heca.tolalinhne.site;

    # SPA static build — copy frontend/build/* here (see deploy/build-frontend.sh).
    root /var/www/heca/build;
    index index.html;

    client_max_body_size 10m;

    # API -> data-api container (host-local port). Preserves /data prefix.
    location /data/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;   # chat may wait on RAG/LLM upstream
        proxy_send_timeout 60s;
    }

    # SPA fallback: serve static, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
