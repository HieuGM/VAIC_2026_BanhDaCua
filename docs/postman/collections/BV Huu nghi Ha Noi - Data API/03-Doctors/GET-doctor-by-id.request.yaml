$kind: http-request
name: 'GET Doctor by ID'
method: GET
url: '{{base_url}}/data/v1/doctors/{{doctor_id}}'
order: 2000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("DoctorDto fields present", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("code");
          pm.expect(json).to.have.property("fullName");
          pm.expect(json).to.have.property("specialty");
      });
      pm.test("404 for unknown id - negative test", function () {
          // This test is informational — run manually with id=999999
      });
