$kind: http-request
name: 'GET Service Prices'
method: GET
url: '{{base_url}}/data/v1/services/{{service_id}}/prices'
order: 2000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is an array", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });
      pm.test("ServicePriceDto has required fields", function () {
          const arr = pm.response.json();
          if (arr.length > 0) {
              const p = arr[0];
              pm.expect(p).to.have.property("id");
              pm.expect(p).to.have.property("priceVnd");
              pm.expect(p).to.have.property("audience");
          }
      });
      pm.test("NOTE: Unknown service id returns 200 [] (not 404)", function () {
          pm.expect(true).to.be.true; // Known behavior from API docs
      });
