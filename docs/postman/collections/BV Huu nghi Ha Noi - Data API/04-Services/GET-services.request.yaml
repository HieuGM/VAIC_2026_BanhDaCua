$kind: http-request
name: 'GET Services (list)'
method: GET
url: '{{base_url}}/data/v1/services'
order: 1000
queryParams:
  - key: category
    value: 'Khám bệnh'
    disabled: true
  - key: department
    value: '1'
    disabled: true
  - key: page
    value: '0'
  - key: size
    value: '20'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("PageResponse structure", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("total");
          pm.expect(json).to.have.property("items");
          pm.expect(json.items).to.be.an("array");
      });
      pm.test("HospitalServiceDto has required fields", function () {
          const json = pm.response.json();
          if (json.items.length > 0) {
              const svc = json.items[0];
              pm.expect(svc).to.have.property("id");
              pm.expect(svc).to.have.property("code");
              pm.expect(svc).to.have.property("name");
          }
      });
      // Save first service id
      const json = pm.response.json();
      if (json.items && json.items.length > 0) {
          pm.collectionVariables.set("service_id", json.items[0].id);
      }
