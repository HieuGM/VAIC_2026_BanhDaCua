$kind: http-request
name: 'GET Hospital Info — 404 when not seeded'
method: GET
url: '{{base_url}}/data/v1/hospital-info'
order: 2000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 404", function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });
      if (pm.response.code === 404) {
          pm.test("Error envelope: code = not_found", function () {
              const json = pm.response.json();
              pm.expect(json.error.code).to.equal("not_found");
          });
      }
