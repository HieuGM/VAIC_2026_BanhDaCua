services:
  postgres:
    image: postgres:16-alpine
    container_name: vaic-hapi-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: vaic-hapi-fhir
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_CONFIG_LOCATION: file:///data/hapi/application.yaml
      # Caps heap chống OOM trên VPS 4GB (image default chiếm MaxRAMPercentage=75% host).
      # hapiproject/hapi entrypoint đọc JAVA_OPTS. config/application.yaml đã tắt ES+cache.
      JAVA_OPTS: "-Xmx512m -XX:MaxMetaspaceSize=200m -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8080:8080"
    volumes:
      - ./config/application.yaml:/data/hapi/application.yaml:ro
    restart: unless-stopped
    mem_limit: 1g

volumes:
  hapi-postgres-data:
